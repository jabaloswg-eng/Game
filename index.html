<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e1a" />
  <title>Emberveil — A Veilwalker's Tale</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icon-180.png" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hud-tl">
        <div id="portrait"><canvas id="portrait-cv" width="96" height="96"></canvas>
          <div id="hud-level">1</div>
        </div>
        <div id="hud-bars">
          <div id="hud-name">Veilwalker<span id="hud-title"></span></div>
          <div class="bar hp"><div id="bar-hp" class="fill"></div><span id="txt-hp"></span></div>
          <div class="bar mp"><div id="bar-mp" class="fill"></div><span id="txt-mp"></span></div>
          <div class="bar xp"><div id="bar-xp" class="fill"></div><span id="txt-xp"></span></div>
          <div id="buffs"></div>
        </div>
      </div>
      <div id="target-frame" class="hidden">
        <div id="target-name">—</div>
        <div class="bar thp"><div id="target-hp" class="fill"></div></div>
      </div>
      <div id="hud-tr">
        <div id="zone-name">Lumenhold</div>
        <canvas id="minimap" width="140" height="140"></canvas>
        <div id="currency">
          <span id="cur-gold" title="Gold">0</span>
          <span id="cur-plat" title="Platinum">0</span>
        </div>
      </div>
      <div id="menu-row">
        <button class="mbtn" data-win="inv">🎒</button>
        <button class="mbtn" data-win="char">🛡️</button>
        <button class="mbtn" data-win="skills">✨</button>
        <button class="mbtn" data-win="quest">📜</button>
        <button class="mbtn" data-win="map">🗺️</button>
        <button class="mbtn" data-win="ach">🏆</button>
        <button class="mbtn plat" data-win="plat">💎</button>
        <button class="mbtn" data-win="settings">⚙️</button>
      </div>
      <div id="log"></div>
      <div id="joy"><div id="joy-base"><div id="joy-knob"></div></div></div>
      <div id="actions">
        <div id="skill-slots">
          <button class="skill-btn" data-slot="0"><canvas width="80" height="80"></canvas><div class="cd"></div><span class="rank"></span></button>
          <button class="skill-btn" data-slot="1"><canvas width="80" height="80"></canvas><div class="cd"></div><span class="rank"></span></button>
          <button class="skill-btn" data-slot="2"><canvas width="80" height="80"></canvas><div class="cd"></div><span class="rank"></span></button>
          <button class="skill-btn" data-slot="3"><canvas width="80" height="80"></canvas><div class="cd"></div><span class="rank"></span></button>
        </div>
        <div id="atk-row">
          <button class="pot-btn" data-pot="0"><span class="picon">🧪</span><span class="pcount"></span></button>
          <button id="btn-attack">⚔️</button>
          <button class="pot-btn" data-pot="1"><span class="picon">💧</span><span class="pcount"></span></button>
        </div>
        <button id="btn-auto" class="off">AUTO</button>
      </div>
      <button id="btn-interact" class="hidden">💬 Talk</button>
      <button id="btn-pickup" class="hidden">✋</button>
    </div>

    <!-- Windows -->
    <div id="windows"></div>
    <div id="toasts"></div>
    <div id="banner" class="hidden"></div>

    <!-- Screens -->
    <div id="screen-title" class="screen">
      <canvas id="title-cv"></canvas>
      <div class="title-stack">
        <h1>EMBERVEIL</h1>
        <h2>A Veilwalker's Tale</h2>
        <div id="slots"></div>
        <div class="title-foot">v1.0 · single-player · works offline</div>
      </div>
    </div>
    <div id="screen-create" class="screen hidden">
      <h3>Choose your Order</h3>
      <div id="class-cards"></div>
      <div id="create-detail"></div>
      <div id="create-form">
        <input id="create-name" maxlength="14" placeholder="Name your hero" autocomplete="off" />
        <div id="hair-pick"></div>
        <button id="btn-create" disabled>Begin</button>
        <button id="btn-create-back" class="ghost">Back</button>
      </div>
    </div>
    <div id="screen-intro" class="screen hidden"><div id="intro-text"></div><button id="btn-intro-skip" class="ghost">Skip ▸</button></div>
    <div id="screen-load" class="screen hidden"><div id="load-zone"></div><div id="load-blurb"></div></div>
    <div id="screen-dead" class="screen hidden">
      <h3>You have fallen…</h3>
      <p id="dead-sub"></p>
      <button id="btn-respawn">Return to Lumenhold</button>
      <button id="btn-feather" class="plat hidden">🔥 Phoenix Feather — revive here</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>

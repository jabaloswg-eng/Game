<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>The Valley — an open world adventure</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #0b1a2a;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #game {
      position: fixed;
      inset: 0;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(180deg, #16324f 0%, #0b1a2a 100%);
      color: #dcecf7;
      z-index: 10;
      transition: opacity 0.6s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading .title {
      font-size: 34px;
      letter-spacing: 3px;
      font-weight: 600;
    }
    #loading .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(220, 236, 247, 0.25);
      border-top-color: #dcecf7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(10, 25, 40, 0.55);
      color: #e8f2fa;
      font-size: 14px;
      letter-spacing: 0.4px;
      white-space: nowrap;
      z-index: 5;
      backdrop-filter: blur(4px);
    }
    #hint b { color: #ffd97a; font-weight: 600; }
    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 5;
      color: #e8f2fa;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    #hpbar {
      width: 220px;
      height: 16px;
      border-radius: 9px;
      background: rgba(10, 25, 40, 0.6);
      border: 1px solid rgba(232, 242, 250, 0.35);
      overflow: hidden;
      margin-top: 4px;
    }
    #hpfill {
      height: 100%;
      width: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, #3fbf5a, #6ee06a);
      transition: width 0.15s ease;
    }
    #hpfill.low { background: linear-gradient(90deg, #c2372b, #e05a3f); }
    #toprow {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #levelbadge {
      background: linear-gradient(180deg, #f2c94c, #c9992e);
      color: #2c2008;
      font-weight: 700;
      font-size: 13px;
      padding: 2px 9px;
      border-radius: 10px;
    }
    #xpbar {
      width: 220px;
      height: 5px;
      border-radius: 3px;
      background: rgba(10, 25, 40, 0.6);
      border: 1px solid rgba(232, 242, 250, 0.25);
      overflow: hidden;
      margin-top: 4px;
    }
    #xpfill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #b98ef2, #7c5bd6);
      transition: width 0.2s ease;
    }
    #levelup {
      position: fixed;
      top: 22%;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      color: #ffe27a;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 8px;
      text-shadow: 0 0 24px rgba(255, 190, 60, 0.9), 0 2px 6px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 7;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #levelup.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    #skillbar {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 5;
    }
    .skill {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: rgba(10, 25, 40, 0.65);
      border: 1px solid rgba(232, 242, 250, 0.4);
      cursor: pointer;
      overflow: hidden;
      user-select: none;
    }
    .skill-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
    .skill-key {
      position: absolute;
      top: 2px;
      left: 5px;
      font-size: 11px;
      color: #ffd97a;
      font-weight: 600;
      z-index: 2;
    }
    .skill-name {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #cfe3f2;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .skill-cd {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0%;
      background: rgba(20, 40, 60, 0.8);
      z-index: 1;
    }
    .skill.locked { filter: grayscale(1) brightness(0.5); cursor: default; }
    .skill.shake { animation: shake 0.3s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    /* ---- touch controls (phones/tablets only) ---- */
    #game, #joystick, .tbtn { touch-action: none; -webkit-user-select: none; user-select: none; }
    #touch-ui { display: none; }
    body.touch #touch-ui { display: block; }
    body.touch #hint { display: none; }
    body.touch #skillbar { display: none; }
    #joystick {
      position: fixed;
      left: max(22px, env(safe-area-inset-left));
      bottom: max(26px, env(safe-area-inset-bottom));
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: rgba(10, 25, 40, 0.35);
      border: 2px solid rgba(232, 242, 250, 0.35);
      z-index: 6;
    }
    #joy-stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(232, 242, 250, 0.55);
      pointer-events: none;
    }
    .tbtn {
      position: fixed;
      border-radius: 50%;
      background: rgba(10, 25, 40, 0.5);
      border: 2px solid rgba(232, 242, 250, 0.45);
      color: #e8f2fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 6;
      overflow: hidden;
    }
    .tbtn.pressed { background: rgba(90, 140, 190, 0.6); }
    .tbtn .btn-icon { font-size: 26px; line-height: 1; }
    .tbtn .btn-label { font-size: 9px; letter-spacing: 1px; margin-top: 2px; opacity: 0.85; }
    .btn-cd {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 0%;
      background: rgba(15, 30, 45, 0.75);
      pointer-events: none;
    }
    /* layout: big attack in the corner, charge left of it, dash above, small jump tucked between */
    #btn-attack { right: max(24px, env(safe-area-inset-right)); bottom: max(28px, env(safe-area-inset-bottom)); width: 86px; height: 86px; }
    #btn-attack .btn-icon { font-size: 36px; }
    #btn-charge { right: 122px; bottom: 30px; width: 62px; height: 62px; }
    #btn-dash   { right: 34px;  bottom: 128px; width: 56px; height: 56px; }
    #btn-jump   { right: 112px; bottom: 108px; width: 46px; height: 46px; }
    #btn-jump .btn-icon { font-size: 20px; }
    #damage-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      box-shadow: inset 0 0 120px 40px rgba(200, 30, 20, 0.55);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #death {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 5, 8, 0.75);
      color: #f2d9d0;
      font-size: 38px;
      letter-spacing: 4px;
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="loading">
    <div class="title">THE VALLEY</div>
    <div class="spinner"></div>
    <div>Preparing your adventure…</div>
  </div>
  <div id="hud">
    <div id="toprow"><span id="levelbadge">Lv 1</span> HP</div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div id="xpbar"><div id="xpfill"></div></div>
  </div>
  <div id="levelup">LEVEL UP!</div>
  <div id="skillbar"></div>
  <div id="touch-ui">
    <div id="joystick"><div id="joy-stick"></div></div>
    <div class="tbtn" id="btn-attack"><span class="btn-icon">⚔️</span><span class="btn-label">ATTACK</span></div>
    <div class="tbtn" id="btn-charge"><span class="btn-icon">⚡</span><span class="btn-label">CHARGE</span><div class="btn-cd"></div></div>
    <div class="tbtn" id="btn-dash"><span class="btn-icon">💨</span><span class="btn-label">DASH</span></div>
    <div class="tbtn" id="btn-jump"><span class="btn-icon">⬆</span></div>
  </div>
  <div id="damage-flash"></div>
  <div id="death">YOU WERE DEFEATED</div>
  <div id="hint">
    <b>WASD</b> move &nbsp;·&nbsp; <b>Click</b> attack &nbsp;·&nbsp; <b>1</b> Charge &nbsp;·&nbsp; <b>E</b> dash
    &nbsp;·&nbsp; <b>Shift</b> sprint &nbsp;·&nbsp; <b>Space</b> jump &nbsp;·&nbsp; <b>Drag mouse</b> look &nbsp;·&nbsp; <b>Scroll</b> zoom
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

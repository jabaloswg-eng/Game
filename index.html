<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Valley — an open world adventure</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #0b1a2a;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #game {
      position: fixed;
      inset: 0;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(180deg, #16324f 0%, #0b1a2a 100%);
      color: #dcecf7;
      z-index: 10;
      transition: opacity 0.6s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading .title {
      font-size: 34px;
      letter-spacing: 3px;
      font-weight: 600;
    }
    #loading .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(220, 236, 247, 0.25);
      border-top-color: #dcecf7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(10, 25, 40, 0.55);
      color: #e8f2fa;
      font-size: 14px;
      letter-spacing: 0.4px;
      white-space: nowrap;
      z-index: 5;
      backdrop-filter: blur(4px);
    }
    #hint b { color: #ffd97a; font-weight: 600; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="loading">
    <div class="title">THE VALLEY</div>
    <div class="spinner"></div>
    <div>Preparing your adventure…</div>
  </div>
  <div id="hint">
    <b>WASD</b> move &nbsp;·&nbsp; <b>Shift</b> sprint &nbsp;·&nbsp; <b>Space</b> jump
    &nbsp;·&nbsp; <b>Drag mouse</b> look around &nbsp;·&nbsp; <b>Scroll</b> zoom
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
